networks:
  web:
    external: true
    name: homelab-web

services:
  # The static front (consumer.chrislawrence.ca) is served by the shared econ
  # container since 2026-11-14: see ../econ/compose.yaml. This repo runs
  # only the updater; ./deploy.sh rebuilds it and then redeploys econ so
  # edits to src/ go live too.
  consumer-updater:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: consumer-updater
    restart: unless-stopped
    user: "1000:1000"
    networks:
      - web
    volumes:
      - ./data:/app/data
    environment:
      - DATA_DIR=/app/data
      - FRED_API_KEY=${FRED_API_KEY:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/api/health || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      # /api/health 503s until the first fetch lands; the warm fetch pulls
      # seventeen series across FRED and Valet, so give it room.
      start_period: 120s
